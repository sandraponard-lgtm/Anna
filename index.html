<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServiceNow CMDB — Certification Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8F9FA;--surface:#FFFFFF;--surface2:#F1F3F5;
  --border:#DEE2E6;--border-strong:#CED4DA;
  --text:#212529;--text2:#495057;--text3:#868E96;
  --accent:#1971C2;--accent-bg:#E7F5FF;--accent-text:#1864AB;
  --success:#2F9E44;--success-bg:#EBFBEE;--success-border:#8CE99A;
  --danger:#C92A2A;--danger-bg:#FFF5F5;--danger-border:#FFA8A8;
  --warn-bg:#FFF9DB;--warn-border:#FFE066;--warn-text:#5C4A00;
  --radius:8px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#141517;--surface:#1A1B1E;--surface2:#212226;
    --border:#2C2E33;--border-strong:#373A40;
    --text:#C1C2C5;--text2:#909296;--text3:#5C5F66;
    --accent:#4DABF7;--accent-bg:#0B2A4A;--accent-text:#74C0FC;
    --success:#69DB7C;--success-bg:#0B2E14;--success-border:#2B8A3E;
    --danger:#FF8787;--danger-bg:#2E0D0D;--danger-border:#C92A2A;
    --warn-bg:#2E2A00;--warn-border:#997A00;--warn-text:#FFE066;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5}
a{color:var(--accent)}

/* Layout */
.shell{display:flex;min-height:100vh}
.sidebar{width:260px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{flex:1;max-width:720px;padding:2rem 2rem 4rem;margin:0 auto}
@media(max-width:700px){.shell{flex-direction:column}.sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--border)}}

/* Sidebar */
.sidebar-header{padding:1.25rem 1rem;border-bottom:1px solid var(--border)}
.sidebar-logo{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.sidebar-title{font-size:15px;font-weight:600;color:var(--text)}
.sidebar-section{padding:.75rem 1rem .25rem;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.sidebar-btn{display:flex;align-items:center;gap:8px;width:100%;padding:.5rem 1rem;font-size:13px;color:var(--text2);background:none;border:none;cursor:pointer;text-align:left;transition:background .1s;border-radius:0}
.sidebar-btn:hover{background:var(--surface2);color:var(--text)}
.sidebar-btn.active{background:var(--accent-bg);color:var(--accent-text);font-weight:500}
.sidebar-btn .badge{margin-left:auto;font-size:11px;background:var(--surface2);color:var(--text3);padding:1px 6px;border-radius:10px}
.sidebar-btn.active .badge{background:var(--accent-bg);color:var(--accent-text)}
.sidebar-stats{padding:1rem;border-top:1px solid var(--border);margin-top:auto}
.stat-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);padding:2px 0}
.stat-row span:last-child{color:var(--text2);font-weight:500}

/* Progress */
.progress-track{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-bottom:1.5rem}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.q-num{font-size:13px;color:var(--text3)}
.score-chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--success-bg);color:var(--success);border:1px solid var(--success-border)}

/* Question */
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.q-tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:.75rem}
.q-text{font-size:15px;color:var(--text);white-space:pre-wrap;line-height:1.65}

/* Options */
.options{display:flex;flex-direction:column;gap:8px;margin-top:1.25rem}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;text-align:left;font-size:14px;color:var(--text);transition:border-color .12s,background .12s;line-height:1.5}
.opt:hover:not([disabled]){border-color:var(--border-strong);background:var(--surface2)}
.opt.selected{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}
.opt.correct{border-color:var(--success-border);background:var(--success-bg);color:var(--success)}
.opt.wrong{border-color:var(--danger-border);background:var(--danger-bg);color:var(--danger)}
.opt-key{font-weight:600;min-width:20px;flex-shrink:0;margin-top:1px}

/* Feedback */
.feedback{display:none;margin-top:.75rem;padding:12px 14px;border-radius:var(--radius);font-size:13px;line-height:1.6}
.feedback.show{display:block}
.feedback.ok{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border)}
.feedback.ko{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border)}

/* Actions */
.actions{display:flex;gap:8px;margin-top:.75rem;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;transition:background .1s}
.btn:hover{background:var(--surface2);color:var(--text)}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{opacity:.9;background:var(--accent)}

/* Result */
.result{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;text-align:center;box-shadow:var(--shadow)}
.result-pct{font-size:52px;font-weight:700;color:var(--text);margin:.25rem 0}
.result-msg{font-size:14px;color:var(--text2);margin-bottom:1.5rem}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.stat-box{background:var(--surface2);border-radius:var(--radius);padding:1rem;text-align:center}
.stat-box .n{font-size:22px;font-weight:600}
.stat-box .l{font-size:12px;color:var(--text3);margin-top:2px}
.n-ok{color:var(--success)}.n-ko{color:var(--danger)}
.result-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* Home screen */
.home{padding:1rem 0}
.home-hero{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;margin-bottom:1.5rem;box-shadow:var(--shadow)}
.home-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:.5rem}
.home-sub{font-size:14px;color:var(--text2);margin-bottom:1.5rem;line-height:1.6}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:1.5rem}
.mode-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1rem;cursor:pointer;transition:border-color .12s,background .12s}
.mode-card:hover{border-color:var(--border-strong);background:var(--surface)}
.mode-card.selected{border-color:var(--accent);background:var(--accent-bg)}
.mode-card h3{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.mode-card p{font-size:12px;color:var(--text3)}
.mode-card.selected h3{color:var(--accent-text)}
.home-warn{padding:12px 14px;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:var(--radius);font-size:13px;color:var(--warn-text);margin-bottom:1rem;display:none}
.home-warn.show{display:block}

/* Tracker dots */
.dot-grid{display:flex;flex-wrap:wrap;gap:4px;padding:1rem}
.dot{width:14px;height:14px;border-radius:3px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;transition:background .1s}
.dot.correct{background:var(--success);border-color:var(--success)}
.dot.wrong{background:var(--danger);border-color:var(--danger)}
.dot.current{outline:2px solid var(--accent);outline-offset:1px}
.dot-legend{display:flex;gap:12px;padding:0 1rem 1rem;font-size:11px;color:var(--text3)}
.dot-legend span{display:flex;align-items:center;gap:4px}
.dot-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
</style>
</head>
<body>

<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">ServiceNow</div>
      <div class="sidebar-title">CMDB Certification Quiz</div>
    </div>

    <div class="sidebar-section">Mode</div>
    <button class="sidebar-btn active" id="mode-all" onclick="selectMode('all')">
      All questions <span class="badge">178</span>
    </button>
    <button class="sidebar-btn" id="mode-wrong" onclick="selectMode('wrong')">
      My mistakes <span class="badge" id="wrong-count">0</span>
    </button>
    <button class="sidebar-btn" id="mode-random" onclick="selectMode('random')">
      Random 20 <span class="badge">20</span>
    </button>
    <button class="sidebar-btn" id="mode-topic" onclick="selectMode('topic')">
      By topic <span class="badge">8</span>
    </button>

    <div class="sidebar-section" id="topic-section" style="display:none">Topic</div>
    <div id="topic-list" style="display:none"></div>

    <div class="sidebar-stats">
      <div class="stat-row"><span>Session correct</span><span id="s-correct">0</span></div>
      <div class="stat-row"><span>Session wrong</span><span id="s-wrong">0</span></div>
      <div class="stat-row"><span>Total mistakes</span><span id="s-mistakes">0</span></div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="main">
    <!-- rendered by JS -->
  </main>
</div>

<script>
/* ── DATA ───────────────────────────────────────────────────────────────── */
const QUESTIONS = [
  {t:"CSDM",q:"A CMDB Architect intends to build a CMDB guidance.\nWhich CMDB will the architect use to build the CSDM sell/consume domain?",opts:["A. Business Service Offering, Business Service","B. Business Capability, Information Object, Business Application","C. Application Service, Technology Management Service (Technical Service), Technology Management Offering (Technical Service Offering)"],ans:[0]},
  {t:"Health Dashboard",q:"A CMDB Administrator would like to minimize stale CIs in the CMDB.\nWhich CMDB Health Dashboard scorecard displays this information?",opts:["A. Completeness","B. Correctness","C. Compliance"],ans:[1]},
  {t:"Service Graph Connector",q:"A CMDB Data Owner has requested better insight on the different data sources that make up the CMDB data set. The Platform Owner knows that the new Service Graph Connector Central plugin is just what is needed.\n\nAfter installing the plugin, what workspace will have the new Service Graph Connector Central tab available?",opts:["A. Service Graph Connector Workspace","B. CMDB Workspace","C. Discovery Admin Workspace"],ans:[1]},
  {t:"Data Manager",q:"A Configuration Manager needs to enable a CMDB Data Manager policy to remove records from a CI Class while retaining the ability to restore them within a specified period.\n\nWhich policy type should the Configuration Manager create?",opts:["A. Certification","B. Delete","C. Retire","D. Archive"],ans:[3]},
  {t:"De-duplication",q:"A CMDB Administrator is asked to clean up the CMDB duplicates.\n\nWhat is the preferred way to manage this task?",opts:["A. My Tasks in the Application Navigator","B. The de-duplication task module","C. The de-duplication dashboard on the CMDB workspace"],ans:[2]},
  {t:"CSDM",q:"A Business Relationship Manager in an organization wants to implement Service Portfolio Management (SPM) and to present offerings to business consumers.\n\nWhich CSDM Domain does this align with?",opts:["A. Build and Integration (Build)","B. Service Consumption (Sell/Consume)","C. Design and Planning (Design)","D. Service Delivery"],ans:[1]},
  {t:"CMDB Workspace",q:"A Service Owner needs to view related items, such as Active Incidents and Planned Changes, directly on the home node of the Unified Map.\n\nWhich work area would allow the Service Owner to meet this goal?",opts:["A. Tool box","B. Map","C. Contextual side panel","D. Content controls"],ans:[2]},
  {t:"Data Manager",q:"Which are CMDB Data Manager end of life policy types? (Choose 2)",opts:["A. Retire","B. Lost","C. Decommission","D. Disposed","E. Archive"],ans:[0,4],multi:true},
  {t:"Health Dashboard",q:"A CMDB Administrator wants to leverage the CMDB Data Foundations Dashboard. (Choose 2)\n\nWhat are benefits of using this application?",opts:["A. Has a framework to create custom metrics for the CMDB","B. Checks that important data is valid and properly configured","C. Provides playbooks to assist in the remediation of potential risks","D. Uses automation to remediate potential risks"],ans:[1,3],multi:true},
  {t:"Data Manager",q:"A CMDB Configuration Manager intends to implement CMDB Data Manager delete and archive policies for all server records in the New York datacenter.\n\nIn which lifecycle state would servers be affected by these new policies?",opts:["A. End of Life - Retired","B. Missing - Stolen","C. Inventory - Available","D. In any lifecycle state"],ans:[0]},
  {t:"CMDB 360",q:"A Configuration Manager wants to explore ServiceNow CMDB 360 saved queries.\n\nWhat insights are gained from CMDB 360 queries? (Choose 2)",opts:["A. Unique CIs created from different data sources","B. Gaps in attribute data from different data sources","C. Different attribute values from different data sources","D. Orphan CIs created from different data sources","E. Duplicate configuration items from different data sources"],ans:[1,2],multi:true},
  {t:"CMDB Workspace",q:"The CMDB Configuration Management team wants to manage de-duplication tasks generated from data ingested into the CMDB via the IRE.\n\nIn which area of the CMDB Workspace can they locate these de-duplication tasks?",opts:["A. Total status tile under the My Work tab","B. CMDB feature adoption tile under the Insights tab","C. Important actions tile under the Home tab"],ans:[2]},
  {t:"CI Management",q:"An organization needs to maintain non-discoverable attributes, such as warranty expiration dates, for hardware CIs. These attributes are not updated by automated discovery tools.\n\nWhat method ensures these attributes are accurately maintained for all CIs?",opts:["A. Use a scheduled data import to update the attributes from an external source","B. Create a new CI class specifically for non-discoverable attributes","C. Use the CMDB Reconciliation Engine to update the attributes"],ans:[0]},
  {t:"CSDM",q:"A Manager needs information on how to correctly establish relationships between Infrastructure CIs, Technology Management Offerings (Technical Service Offerings), and Application Services within the CMDB.\n\nWhich CSDM domain would provide this information?",opts:["A. Build and Integration (Build)","B. Foundation","C. Design and Planning (Design)","D. Service Consumption (Sell / Consume)","E. Service Delivery (Manage Technical Services)"],ans:[4]},
  {t:"De-duplication",q:"A CMDB Administrator seeks to understand the available tools for preventing, addressing, and remediating duplicate CIs.\n\n1. Can be assigned to groups for resolving duplicate CIs\n2. Offers insight into duplicate CIs within the CMDB\n3. Offers a solution to resolve de-duplication tasks in bulk\n4. Provides a wizard to resolve de-duplication tasks individually\n\nMatch each description:\nA. De-Duplication Tasks\nB. CMDB Health Dashboard Correctness Scorecard\nC. De-Duplication Templates\nD. Certification Task\nE. Duplicate CI Remediator",opts:["A → 1, B → 2, C → 3, E → 4","D → 1, B → 2, C → 3, E → 4","D → 1, B → 2, A → 3, C → 4","A → 1, B → 2, E → 3, C → 4"],ans:[1]},
  {t:"Health Dashboard",q:"A CMDB Administrator uses the CMDB Data Foundations Dashboard and sees low scores for several metrics.\n\nWhich actions can the CMDB Administrator take to improve the CMDB Health? (Choose 2)",opts:["A. Use the Remediation Playbooks linked beside each metric","B. Focus on metric(s) with Critical and High priorities","C. Remove non-operational and retired CIs","D. Adjust the metrics using exclusion rules to improve the scores"],ans:[0,1],multi:true},
  {t:"Service Graph Connector",q:"A CMDB Administrator needs the fastest time to value solution for effectively ingesting, managing, and maintaining CIs and relationships.\n\nWhich management tool will accomplish this to import Windows computer data from SCCM?",opts:["A. Import set using JDBC data source connection to SCCM using transform maps","B. SCCM Usage Metering Spoke","C. SCCM Service Graph Connector","D. IntegrationHub ETL connection to SCCM using Robust Transform Engine (RTE)"],ans:[2]},
  {t:"CI Class Manager",q:"An organization is updating the CMDB to include new asset types like IoT devices. Relevant CI classes need to be added and outdated ones need to be removed from the Principal Class filter.\n\nWhich roles are needed to add or remove classes? (Choose 2)",opts:["A. cmdb_query_builder","B. personalize_dictionary","C. sn_csdm_admin","D. sn_cmdb_admin"],ans:[1,3],multi:true},
  {t:"Data Manager",q:"A Configuration Management team wants to confirm that all servers in the CMDB are correctly associated with their location.\n\nWhich CMDB Data Manager policy type does the team create?",opts:["A. Retire","B. Delete","C. Attestation","D. Certification","E. Archive"],ans:[3]},
  {t:"CMDB 360",q:"The Server class uses 'lowest value' for Disk Space (GB). The Windows Server class uses 'most reported' for Disk Space (GB).\n\nData: Tivoli 75 | ServiceNow 75 | LANDesk 50 | Altiris 80\n\nWhich value would be added to the CMDB for a Windows Server record?",opts:["A. 80","B. 75","C. 50"],ans:[1]},
  {t:"CI Management",q:"An Asset Manager wants to ensure that Asset records and CI records are kept synchronized automatically.\n\nHow does the Manager do this? (Choose 2)",opts:["A. Ensure one-to-one physical mapping between Asset and CI","B. Ensure that the business rule to update Asset fields on change on the CI table is active","C. Ensure that scheduled jobs are run during off-business hours","D. Ensure that the business rule to update CI fields on change on the asset table is active"],ans:[1,3],multi:true},
  {t:"CI Management",q:"User endpoint devices are imported into the CMDB and populate the 'Assigned to' field on the Computer CI. The Asset team requests the Configuration Analysts to populate the 'Assigned to' field on the related Asset.\n\nWhat action does a Configuration Analyst take to achieve this in an automated way?",opts:["A. Use the Asset-CI Field Mapping module to create a new rule to replicate the 'Assigned to' value between the asset and associated CI","B. Configure a business rule on the computer table to use a script to populate the 'Assigned to' field on the asset","C. Hide the 'Assigned to' field on the asset record and create a new field that dot walks to the related CI"],ans:[0]},
  {t:"CSDM",q:"A retail organization needs to ensure that incidents affecting customer-facing services are resolved quickly to reduce potential revenue loss.\n\nWhich CSDM attribute is used to prioritize these services?",opts:["A. Assignment Group on the CI record","B. Affected CIs in the Incident record","C. Service classification in the Technical Service","D. Business Criticality in the Service Offering"],ans:[3]},
  {t:"CI Management",q:"The Change Management team in an organization wants to implement a Change across multiple CIs at the same time.\n\nWhich field on the Change Request form needs to be populated with a dynamic CI group?",opts:["A. Configuration Item","B. Business Service","C. Service Offering"],ans:[0]},
  {t:"CSDM",q:"A company wants to track regulatory compliance. ServiceNow has an artifact type called an information object as part of the CSDM framework.\n\nWhat is the purpose of an information object?",opts:["A. It describes data in general on a group of Configuration Items","B. It describes the logical data to the Business Applications","C. It describes data exchanged between an API interface and an Application"],ans:[1]},
  {t:"CMDB Workspace",q:"Where can an administrator perform Natural Language Queries (NLQ)?",opts:["A. CMDB Data Manager","B. CI Class Manager","C. CMDB Workspace","D. CMDB Health Dashboard"],ans:[2]},
  {t:"IRE",q:"Two new CI records are imported into the hardware class:\nCI1: name matches an existing CI record.\nCI2: IP address matches an existing CI record.\n\nHardware Identification Rule priorities: Serial Number (100), Hardware name (300), Network Adapter mac_address/name (400).\n\nWhich is correct?",opts:["A. CI1 will be updated with matching record and CI2 will be inserted as new record","B. CI1 and CI2 both will be inserted as new records"],ans:[0]},
  {t:"CI Class Manager",q:"A CMDB Administrator is working in the CI Class Manager on the Basic Info tab.\n\nHow can the class be set as a Principal Class?",opts:["A. Click the Principal Class UI Action button","B. Check the Principal Class check box","C. Select 'Yes' from the Principal Class choice list"],ans:[1]},
  {t:"Health Dashboard",q:"A Configuration Manager is implementing end-to-end service modeling and wants to get help on status and playbooks for improving quality.\n\nWhat does the Configuration Manager reference to obtain guidance?",opts:["A. CMDB Data Foundation Dashboard","B. CMDB Workspace","C. CSDM Data Foundation Dashboard","D. Service Mapping Data Foundation Dashboard"],ans:[2]},
  {t:"CSDM",q:"The Incident Process Owner asks which classes of CSDM are used on the Incident form. (Choose 2)",opts:["A. Business Application","B. Service Offering","C. Application Service","D. Service Portfolio"],ans:[1,2],multi:true},
  {t:"IRE",q:"A CMDB Administrator needs to configure a new application identification rule that considers the potential for the same application installed more than once on the same server.\n\nWhich is the best choice of a criterion attribute?",opts:["A. Configuration File Name","B. Configuration File Path","C. Class","D. Version","E. Port"],ans:[1]},
  {t:"CMDB 360",q:"Where can a CMDB 360/Multisource CMDB Saved Query be viewed and created in the CMDB Workspace?",opts:["A. CMDB Query Builder","B. Coverage window on the CMDB 360 tab","C. Saved queries window on the CMDB 360 tab","D. Saved queries window on the Insights tab"],ans:[2]},
  {t:"CI Class Manager",q:"A CMDB CI Class Owner responsible for the Windows Servers needs to manage the Windows Server class.\n\nWhich CI Class Manager feature will help the CI Class Owner streamline this task?",opts:["A. Search CI Classes","B. Pinned Classes","C. CI Favorites"],ans:[1]},
  {t:"CSDM",q:"A Configuration Management Governance team is transitioning from legacy CMDB status fields to CSDM life cycle status fields.\n\nWhich table can be modified?",opts:["A. Life Cycle Stages [life_cycle_stage]","B. Life Cycle Controls [life_cycle_control]","C. Life Cycle Stage Status [life_cycle_stage_status]","D. Life Cycle Mapping [life_cycle_mapping]"],ans:[3]},
  {t:"IRE",q:"A CMDB Administrator needs to prevent duplicate CI creation from import sets that load data into the CMDB from vendor shipment files.\n\nHow can the Administrator do this?",opts:["A. Create comparison rules in the IRE","B. Use the CMDBTransformUtil API in the transform script","C. Set the system property to utilize the IRE within transform maps","D. Set the coalesce on two mappings within the transform map"],ans:[3]},
  {t:"Health Dashboard",q:"The CMDB Health Dashboard is based on three KPIs: Correctness, Compliance, and Completeness.\n\nWhich sub-metric belongs to Completeness?",opts:["A. Audit","B. Orphan","C. Required","D. Duplicate","E. Stale"],ans:[2]},
  {t:"Health Dashboard",q:"The CMDB Health Dashboard is based on three KPIs: Correctness, Compliance, and Completeness.\n\nWhich sub-metric belongs to Compliance?",opts:["A. Audit","B. Orphan","C. Required","D. Duplicate","E. Stale"],ans:[0]},
  {t:"Health Dashboard",q:"The CMDB Health Dashboard is based on three KPIs: Correctness, Compliance, and Completeness.\n\nWhich sub-metric belongs to Correctness?",opts:["A. Audit","B. Orphan","C. Required","D. Duplicate","E. Stale"],ans:[1]},
  {t:"CMDB 360",q:"A CMDB Administrator needs to set up CMDB 360/Multisource CMDB.\n\nWhich system property enables CMDB 360?",opts:["A. glide.cmdb.workspace.enable_multisource","B. glide.cmdb.multisource.enable_non_cmdb_classes","C. glide.identification_engine.log_enabled"],ans:[0]},
  {t:"CI Management",q:"A CMDB Administrator notices that CIs do not have a support group.\n\nHow can the support group be automatically populated and maintained on the CI record?",opts:["A. Dynamic CI group","B. Technology Management Service (Technical Service)","C. CI Class Manager","D. Technology Management Service Offering (Technical Service Offering)"],ans:[1]},
  {t:"Data Manager",q:"Where does a user with the appropriate role(s) review and manage the generated tasks after configuring CMDB Data Manager policies?",opts:["A. CMDB Health Dashboard > Duplicate CIs tab","B. CMDB Workspace > My Work tab","C. CMDB Workspace > Management tab","D. CMDB Health Dashboard > Audit tab"],ans:[1]},
  {t:"IRE",q:"A global enterprise integrates data from multiple discovery sources. Each discovery source categorizes the same CIs differently, leading to duplicates and inconsistencies.\n\nWhat actions does the CMDB team take to resolve the issue? (Choose 2)",opts:["A. Use CI Class Manager to establish standardized CI classes and attributes across all discovery sources","B. Allow each discovery source to define its own CI class","C. Implement identification and reconciliation rules to avoid duplicates and standardize CI classification","D. Create a custom script to manually adjust incoming data before storing it in the CMDB"],ans:[0,2],multi:true},
  {t:"CMDB Workspace",q:"A Configuration Manager working in the CMDB Workspace wants to see how CIs are connected to each other.\n\nWhich tool can be used?",opts:["A. Relationship Map","B. Unified Map","C. Business Service Map"],ans:[0]},

/* ── TOPICS ─────────────────────────────────────────────────────────────── */
const TOPICS = [...new Set(QUESTIONS.map(q => q.t))].sort();

/* ── STATE ──────────────────────────────────────────────────────────────── */
let state = {
  mode: 'all',
  topic: null,
  queue: [],
  idx: 0,
  answered: false,
  selected: new Set(),
  sessionCorrect: 0,
  sessionWrong: 0,
  wrongIds: new Set(),
  results: []   // per question: null | true | false
};

/* ── INIT ────────────────────────────────────────────────────────────────── */
function buildTopicList() {
  const tl = document.getElementById('topic-list');
  tl.innerHTML = TOPICS.map(t => {
    const n = QUESTIONS.filter(q => q.t === t).length;
    return `<button class="sidebar-btn" id="topic-${t.replace(/\s/g,'_')}" onclick="selectTopic('${t}')">${t}<span class="badge">${n}</span></button>`;
  }).join('');
}

function selectMode(m) {
  state.mode = m; state.topic = null;
  ['all','wrong','random','topic'].forEach(x => document.getElementById('mode-'+x).classList.toggle('active', x === m));
  document.getElementById('topic-section').style.display = m === 'topic' ? '' : 'none';
  document.getElementById('topic-list').style.display = m === 'topic' ? '' : 'none';
  if (m !== 'topic') startQuiz();
}

function selectTopic(t) {
  state.topic = t;
  document.querySelectorAll('#topic-list .sidebar-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('topic-'+t.replace(/\s/g,'_')).classList.add('active');
  startQuiz();
}

function shuffle(a) { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; } return a; }

function startQuiz() {
  let pool;
  if (state.mode === 'all') pool = QUESTIONS.map((_,i)=>i);
  else if (state.mode === 'wrong') { pool = [...state.wrongIds]; if (!pool.length){ showNoWrong(); return; } }
  else if (state.mode === 'random') pool = shuffle(QUESTIONS.map((_,i)=>i)).slice(0,20);
  else if (state.mode === 'topic') pool = QUESTIONS.map((_,i)=>i).filter(i => QUESTIONS[i].t === state.topic);

  state.queue = pool;
  state.idx = 0;
  state.answered = false;
  state.selected = new Set();
  state.sessionCorrect = 0;
  state.sessionWrong = 0;
  state.results = pool.map(() => null);
  renderQ();
}

function showNoWrong() {
  document.getElementById('main').innerHTML = `
    <div class="home">
      <div class="home-hero">
        <div class="home-title">No mistakes recorded yet</div>
        <div class="home-sub">Answer some questions first, then come back to review your mistakes.</div>
        <button class="btn btn-primary" onclick="selectMode('all')">Start with all questions</button>
      </div>
    </div>`;
}

/* ── RENDER ──────────────────────────────────────────────────────────────── */
function renderQ() {
  if (state.idx >= state.queue.length) { renderResult(); return; }

  const qi = state.queue[state.idx];
  const q = QUESTIONS[qi];
  const isMulti = !!q.multi;
  const pct = Math.round((state.idx / state.queue.length) * 100);
  const letters = 'ABCDEFGHIJ';

  state.answered = false;
  state.selected = new Set();

  const opts = q.opts.map((o,i) => `
    <button class="opt" id="opt${i}" onclick="pick(${i})">
      <span class="opt-key">${letters[i]}.</span>
      <span>${o}</span>
    </button>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-header">
      <span class="q-num">Question ${state.idx+1} of ${state.queue.length}</span>
      <span class="score-chip">${state.sessionCorrect} correct</span>
    </div>
    <div class="q-card">
      <div class="q-tag">${q.t} · ${isMulti ? 'Choose ' + q.ans.length : 'Single answer'}</div>
      <div class="q-text">${q.q}</div>
      <div class="options">${opts}</div>
      <div class="feedback" id="fb"></div>
    </div>
    <div class="actions">
      ${isMulti ? `<button class="btn btn-primary" id="validate-btn" onclick="validateMulti()" disabled>Submit answer</button>` : ''}
      <button class="btn" id="next-btn" onclick="nextQ()" style="display:none">Next →</button>
      <button class="btn" onclick="skipQ()">Skip</button>
    </div>`;

  updateSidebar();
}

function pick(i) {
  if (state.answered) return;
  const q = QUESTIONS[state.queue[state.idx]];
  if (!q.multi) {
    document.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
    document.getElementById('opt'+i).classList.add('selected');
    state.selected = new Set([i]);
    validateSingle();
  } else {
    const btn = document.getElementById('opt'+i);
    if (state.selected.has(i)) { state.selected.delete(i); btn.classList.remove('selected'); }
    else { state.selected.add(i); btn.classList.add('selected'); }
    document.getElementById('validate-btn').disabled = state.selected.size === 0;
  }
}

function validateSingle() {
  state.answered = true;
  const qi = state.queue[state.idx];
  const q = QUESTIONS[qi];
  const correct = q.ans[0];
  const chosen = [...state.selected][0];
  const ok = chosen === correct;
  applyResult(qi, ok, [correct]);
}

function validateMulti() {
  state.answered = true;
  const qi = state.queue[state.idx];
  const q = QUESTIONS[qi];
  const correctSet = new Set(q.ans);
  const ok = state.selected.size === q.ans.length && [...state.selected].every(i => correctSet.has(i));
  applyResult(qi, ok, q.ans);
  document.getElementById('validate-btn').style.display = 'none';
}

function applyResult(qi, ok, correctAns) {
  const q = QUESTIONS[qi];
  const letters = 'ABCDEFGHIJ';
  const correctSet = new Set(correctAns);

  if (ok) { state.sessionCorrect++; state.wrongIds.delete(qi); }
  else { state.sessionWrong++; state.wrongIds.add(qi); }
  state.results[state.idx] = ok;

  document.querySelectorAll('.opt').forEach((btn,i) => {
    btn.disabled = true;
    if (correctSet.has(i)) btn.classList.add('correct');
    else if (state.selected.has(i) && !correctSet.has(i)) btn.classList.add('wrong');
  });

  const fb = document.getElementById('fb');
  fb.style.display = 'block';
  if (ok) {
    fb.className = 'feedback ok';
    fb.textContent = '✓ Correct!';
  } else {
    fb.className = 'feedback ko';
    fb.innerHTML = `✗ Incorrect. Correct answer${correctAns.length > 1 ? 's' : ''}: ${correctAns.map(i => '<strong>'+letters[i]+'</strong>').join(', ')}`;
  }

  const nb = document.getElementById('next-btn');
  if (nb) nb.style.display = 'inline-block';
  updateSidebar();
}

function nextQ() { state.idx++; renderQ(); }
function skipQ() {
  const qi = state.queue[state.idx];
  state.wrongIds.add(qi);
  state.results[state.idx] = false;
  state.sessionWrong++;
  state.idx++;
  renderQ();
}

function renderResult() {
  const total = state.queue.length;
  const pct = Math.round((state.sessionCorrect/total)*100);
  const msg = pct >= 80 ? '🎉 Great score!' : pct >= 60 ? '👍 Good work, keep reviewing!' : '📚 Keep studying — you\'ve got this!';

  document.getElementById('main').innerHTML = `
    <div class="result">
      <div class="q-tag">Session complete</div>
      <div class="result-pct">${pct}%</div>
      <div class="result-msg">${msg}</div>
      <div class="result-grid">
        <div class="stat-box"><div class="n n-ok">${state.sessionCorrect}</div><div class="l">Correct</div></div>
        <div class="stat-box"><div class="n n-ko">${state.sessionWrong}</div><div class="l">Wrong</div></div>
        <div class="stat-box"><div class="n">${total}</div><div class="l">Total</div></div>
      </div>
      <div class="result-actions">
        <button class="btn btn-primary" onclick="startQuiz()">Restart this mode</button>
        ${state.wrongIds.size ? `<button class="btn" onclick="selectMode('wrong')">Review mistakes (${state.wrongIds.size})</button>` : ''}
        <button class="btn" onclick="selectMode('all')">All questions</button>
      </div>
    </div>`;

  updateSidebar();
}

function updateSidebar() {
  document.getElementById('wrong-count').textContent = state.wrongIds.size;
  document.getElementById('s-correct').textContent = state.sessionCorrect;
  document.getElementById('s-wrong').textContent = state.sessionWrong;
  document.getElementById('s-mistakes').textContent = state.wrongIds.size;
}

/* ── BOOT ────────────────────────────────────────────────────────────────── */
buildTopicList();
startQuiz();
</script>
</body>
</html>
